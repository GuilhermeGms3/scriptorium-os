services:
  scriptorium:
    build:
      context: .
      dockerfile: Dockerfile
    image: scriptorium-os:local
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
