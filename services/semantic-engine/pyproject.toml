[project]
name = "scriptorium-semantic-engine"
version = "0.1.0"
description = "Serviço local opcional de tradução e análise contextual do Scriptorium"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.28,<1",
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
  "sentencepiece>=0.2,<1",
  "sacremoses>=0.1,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
commentary = ["pypdf>=6.12,<7"]
test = ["httpx>=0.28,<1", "mypy>=1.11,<2", "pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package (no build-system): tests import `app` from here.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# B008: FastAPI's Depends in default arguments. RUF001: typographic quotes are intentional.
ignore = ["B008", "RUF001"]

[tool.mypy]
strict = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

