name: Semantic engine
permissions:
  contents: read
on:
  push:
    paths: ["services/semantic-engine/**", ".github/workflows/semantic-engine.yml"]
  pull_request:
    paths: ["services/semantic-engine/**", ".github/workflows/semantic-engine.yml"]
jobs:
  verify:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: services/semantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uv sync --locked --extra test --extra commentary --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} --extra test --extra commentary pytest tests -q
      - run: uv run --locked --python ${{ matrix.python }} --extra test --extra commentary mypy --strict app
      - run: uv run --locked --python ${{ matrix.python }} --extra test --extra commentary ruff check app tests scripts
