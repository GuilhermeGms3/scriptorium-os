name: Android native
permissions:
  contents: read
on:
  push:
    paths: ["android/**", "scripts/mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "scripts/mobile/**", ".github/workflows/android.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The runner keeps sdkmanager in the SDK, not on the PATH.
      - run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
